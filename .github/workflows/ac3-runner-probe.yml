name: AC3 runner probe (SON-4889)
on:
  workflow_dispatch:
    inputs:
      hold:
        description: seconds to keep the runner pod alive
        default: '120'
        required: false
jobs:
  probe:
    runs-on: spark-openclaw
    timeout-minutes: 15
    steps:
      - name: marker
        run: echo "SON-4889 AC3 CI-runner probe on $(uname -a) at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - name: hold
        env:
          HOLD_SECONDS: ${{ inputs.hold || '120' }}
        shell: bash
        run: |
          if [[ ! "$HOLD_SECONDS" =~ ^[0-9]{1,3}$ ]] || (( 10#$HOLD_SECONDS > 900 )); then
            echo "hold must be an integer from 0 to 900 seconds" >&2
            exit 2
          fi
          sleep "$HOLD_SECONDS"
